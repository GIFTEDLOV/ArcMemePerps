name: CLUSTER Safety & Liquidation Keeper Watchdog

on:
  schedule:
    # Read-only sentinel every 15 minutes; never broadcast from a schedule
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Run in dry-run mode (no external webhooks)'
        required: false
        default: 'true'

jobs:
  watchdog-cycle:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.0.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run CLUSTER Keeper & Liquidation Cycle
        env:
          ARC_RPC_URL: https://rpc.mainnet.arc.io
          ARC_KEEPER_PRIVATE_KEY: ${{ secrets.ARC_KEEPER_PRIVATE_KEY }}
          CLUSTER_KEEPER_LIVE_APPROVED: ${{ vars.CLUSTER_KEEPER_LIVE_APPROVED }}
          CLUSTER_MAINNET_TRADING_ENABLED: ${{ vars.CLUSTER_MAINNET_TRADING_ENABLED }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" &&
                "${{ github.event.inputs.dryRun }}" == "false" &&
                "$CLUSTER_KEEPER_LIVE_APPROVED" == "true" &&
                "$CLUSTER_MAINNET_TRADING_ENABLED" == "true" ]]; then
            echo "Manual keeper invocation: release conditions explicitly approved."
            pnpm keeper:once --live
          else
            echo "Keyless read-only Arc keeper monitoring; no signed transactions."
            pnpm keeper:once --dry-run
          fi
