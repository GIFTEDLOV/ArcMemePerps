name: Arc Safety Keeper Watchdog

on:
  schedule:
    # Run every 30 minutes autonomously
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Run in dry-run mode (no external webhooks)'
        required: false
        default: 'false'

jobs:
  watchdog-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.0.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Safety Keeper Watchdog Cycle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "${{ github.event.inputs.dryRun }}" = "true" ]; then
            pnpm keeper:once --dry-run
          else
            pnpm keeper:once
          fi

      - name: Commit Updated Keeper State
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(keeper): update keeper state & risk audit [skip ci]"
          file_pattern: "evidence/keeper-state.json"
