name: CLUSTER Keeper Read-only Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.0.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Read-only Keeper Diagnostics
        env:
          ARC_RPC_URL: https://rpc.mainnet.arc.io
        run: pnpm keeper:once --dry-run
