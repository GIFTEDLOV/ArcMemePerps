name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cluster_test
          POSTGRES_PASSWORD: cluster_test
          POSTGRES_DB: cluster_index_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U cluster_test -d cluster_index_test"
          --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      ARC_INDEX_TEST_DATABASE_URL: postgres://cluster_test:cluster_test@localhost:5432/cluster_index_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: foundry-rs/foundry-toolchain@v1
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm frontend:test
      - run: pnpm frontend:build
      - run: forge build
      - run: forge test
      - run: forge fmt --check
