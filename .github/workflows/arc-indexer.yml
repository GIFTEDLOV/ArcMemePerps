name: Arc read-only indexer

on:
  push:
    branches: [main]
    paths: [".github/workflows/arc-indexer.yml"]
  schedule:
    - cron: "7-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arc-mainnet-read-only-indexer
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.CLUSTER_INDEX_WORKER_DATABASE_URL }}
      ARC_INDEX_RPC_PRIMARY: ${{ vars.CLUSTER_ARC_RPC_PRIMARY || 'https://rpc.mainnet.arc.io' }}
      ARC_INDEX_RPC_SECONDARY: ${{ vars.CLUSTER_ARC_RPC_SECONDARY || 'https://rpc.quicknode.mainnet.arc.io' }}
      ARC_INDEX_MAX_WINDOWS: ${{ vars.ARC_INDEX_MAX_WINDOWS || '25' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/cluster-infra-operations-2026-10-30
      - name: Pin to exact tested indexer commit
        run: git checkout 3f34681fc16cd9020b9c4f6574b1412db4546a6a
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require configured persistent database
        shell: bash
        run: |
          if [[ -z "$DATABASE_URL" ]]; then
            echo "::error::CLUSTER_INDEX_WORKER_DATABASE_URL is not configured. No index run was attempted."
            exit 1
          fi
      - name: Index finalized Arc events with bounded catch-up
        shell: bash
        run: |
          set -euo pipefail
          # Multiple bounded cycles recover after GitHub schedule delays.
          for cycle in {1..6}; do
            echo "Arc indexer catch-up cycle ${cycle}/6"
            result="$(pnpm --filter @arcmemeperps/indexer arc:backfill)"
            printf '%s\n' "$result"
            if [[ "$result" == *'"status":"SKIPPED_CONCURRENT_INDEXER_RUNNING"'* ]]; then
              echo "A different Neon writer holds the lock; no overlapping run."
              break
            fi
            if [[ "$result" != *'"windows":'* ]]; then
              echo "::error::Indexer returned no structured coverage."
              exit 1
            fi
            if [[ "$result" == *'"windows":0'* ]]; then
              echo "Already at selected finalized head."
              break
            fi
            if [[ "$cycle" -lt 6 ]]; then sleep 15; fi
          done
