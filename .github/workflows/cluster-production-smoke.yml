name: CLUSTER Production Live Endpoint Smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cluster-production-smoke.yml"
  workflow_dispatch:
  schedule:
    - cron: "29 */6 * * *"

permissions:
  contents: read

concurrency:
  group: cluster-production-smoke
  cancel-in-progress: false

jobs:
  live-http-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify public frontend and live API JSON contracts
        env:
          FRONTEND_ORIGIN: https://arcmemeperps.vercel.app
          API_ORIGIN: https://cluster-readonly-api.vercel.app
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          const frontend = process.env.FRONTEND_ORIGIN;
          const api = process.env.API_ORIGIN;
          const abort = AbortSignal.timeout(25000);
          async function request(label,url,accept,allowed=[200]) {
            const res=await fetch(url,{signal:abort,headers:{"accept":accept},redirect:"follow"});
            const type=res.headers.get("content-type")??"";
            const body=await res.text();
            const ok=allowed.includes(res.status) && (accept==="application/json"
              ? type.includes("application/json") : type.includes("text/html"));
            const result={label,status:res.status,ok,contentType:type.slice(0,48),bytes:body.length};
            console.log(JSON.stringify(result));
            if(!ok) throw Error(label+" HTTP_OR_CONTENT_TYPE_FAILED "+res.status+" "+body.slice(0,170));
            if(accept==="application/json"){try{return {status:res.status,value:JSON.parse(body)}}
              catch{throw Error(label+" INVALID_JSON")}}
            if(!body.includes('<html')&&!body.includes('<!DOCTYPE html'))throw Error("FRONTEND_HTML_NOT_FOUND");
            return {status:res.status,value:body};
          }
          const home=await request("frontend",frontend+"/","text/html");
          if(!home.value.includes('<div id="root"'))throw Error("FRONTEND_ROOT_NOT_FOUND");
          const health=await request("api-health",api+"/health","application/json");
          if(health.value.status!=="ok"||health.value.readOnly!==true)throw Error("API_HEALTH_NOT_READ_ONLY");
          const status=await request("protocol-status",api+"/api/v1/protocol/status","application/json");
          if(status.value.readOnly!==true||status.value.tradingEnabled===true)
            throw Error("PUBLIC_TRADING_UNEXPECTEDLY_ENABLED");
          const markets=await request("markets",api+"/api/v1/markets?limit=2","application/json");
          if(!Array.isArray(markets.value.items))throw Error("MARKETS_NOT_ARRAY");
          const index=await request("index-status",api+"/api/v1/index/status","application/json");
          if(typeof index.value.throughBlock!=="string" || !Number.isFinite(index.value.gaps))
            throw Error("ARC_INDEX_COVERAGE_MISSING");
          console.log(JSON.stringify({arcIndexThroughBlock:index.value.throughBlock,gaps:index.value.gaps,
            sourceConflicts:index.value.singleSourceRanges,events:index.value.observedContractEvents}));
          const wallet=await request("wallet-index-read",api+"/api/v1/wallet/0x1111111111111111111111111111111111111111","application/json");
          if(!wallet.value.readOnly||wallet.value.complete!==false||
             !Array.isArray(wallet.value.wallet?.positions)||!Array.isArray(wallet.value.wallet?.activity))
            throw Error("WALLET_RECEIPT_PROJECTION_UNAVAILABLE");
          const invalid=await request("reject-invalid-wallet",api+"/api/v1/wallet/not-an-arc-address","application/json",[400]);
          if(invalid.value.error!=="INVALID_ARC_ADDRESS")throw Error("INVALID_WALLET_NOT_REJECTED");
          console.log("CLUSTER_PRODUCTION_SMOKE_PASSED");
          EOF

  browser-render-verification:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout source for browser runtime dependencies
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @arcmemeperps/frontend exec playwright install --with-deps chromium
      - name: Verify React renders and cross-origin API is accessible on desktop/mobile
        env:
          FRONTEND_ORIGIN: https://arcmemeperps.vercel.app
          API_ORIGIN: https://cluster-readonly-api.vercel.app
        working-directory: apps/frontend
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import { chromium } from '@playwright/test';
          const browser=await chromium.launch({headless:true});
          try{
            for(const [label,viewport] of [
              ["desktop",{width:1365,height:850}],
              ["mobile",{width:390,height:844}],
            ]){
              const page=await browser.newPage({viewport});
              const exceptions=[];
              page.on('pageerror',error=>exceptions.push(error.message));
              const response=await page.goto(process.env.FRONTEND_ORIGIN+'/markets',{waitUntil:'domcontentloaded',timeout:30000});
              if(response?.status()!==200)throw Error(label+" MARKETS_HTTP_"+response?.status());
              await page.locator('#root').waitFor({state:'visible',timeout:20000});
              await page.getByRole('heading',{name:'Markets'}).first().waitFor({state:'visible',timeout:20000});
              const bodyText=await page.locator('#root').innerText();
              if(bodyText.length<150)throw Error(label+" APP_RENDER_INCOMPLETE");
              const result=await page.evaluate(async origin=>{
                const res=await fetch(origin+'/api/v1/protocol/status',{cache:'no-store'});
                return {status:res.status,data:await res.json()};
              },process.env.API_ORIGIN);
              if(result.status!==200||result.data.readOnly!==true||result.data.tradingEnabled===true)
                throw Error(label+" API_CORS_OR_TRADING_RELEASE_FAILURE");
              if(exceptions.length)throw Error(label+" BROWSER_EXCEPTIONS "+exceptions.slice(0,3).join(' | '));
              console.log(JSON.stringify({browser:label,rendered:true,apiCors:true,marketsTextBytes:bodyText.length}));
              await page.close();
            }
            console.log('CLUSTER_PRODUCTION_BROWSER_SMOKE_PASSED');
          } finally{await browser.close()}
          EOF
