name: CLUSTER Mainnet read-only keeper sentinel

# This does not execute trades or liquidations, use private keys, or commit state.
# It replaces the disabled key-dependent legacy keeper watchdog with diagnostics.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cluster-readonly-keeper-sentinel
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARC_RPC_URL: https://rpc.mainnet.arc.io
      KEEPER_ENABLE_MAINNET_LIQUIDATIONS: "false"
      KEEPER_STATE_FILE: ${{ runner.temp }}/cluster-readonly-keeper-state.json
    steps:
      - name: Checkout reviewed read-only keeper implementation
        uses: actions/checkout@v4
        with:
          ref: 3f34681fc16cd9020b9c4f6574b1412db4546a6a
          persist-credentials: false
      - name: Use pnpm 11.0.9
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install verified dependencies
        run: pnpm install --frozen-lockfile
      - name: Run read-only Mainnet diagnostics
        # Explicitly no ARC_KEEPER_PRIVATE_KEY, wallet or execution enablement.
        run: pnpm keeper:once --dry-run
