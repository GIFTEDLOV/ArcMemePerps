name: CLUSTER Product Testnet receipt-free live audit

on:
  push:
    branches: [main]
    paths:
      - "scripts/testnet-product-live-probe.mjs"
      - ".github/workflows/product-testnet-live-audit.yml"
  pull_request:
    paths:
      - "scripts/testnet-product-live-probe.mjs"
      - ".github/workflows/product-testnet-live-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify existing Product Testnet contracts and collateral live
        run: node scripts/testnet-product-live-probe.mjs
