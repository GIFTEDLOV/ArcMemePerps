[profile.default]
src = "contracts/src"
test = "contracts/test"
script = "contracts/script"
out = "out"
cache_path = "cache/foundry"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true

# The Arc local multi-account E2E harness is intentionally broad and is compiled with
# the standard pipeline to keep local runtime feedback bounded. Production/default
# artifacts continue to use the optimized via-IR profile above.
[profile.local-e2e]
src = "contracts/src"
test = "contracts/test"
script = "contracts/script"
out = "out"
cache_path = "cache/foundry-local-e2e"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 1
via_ir = false

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"
